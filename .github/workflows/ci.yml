name: Validate ADE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate template contracts
        run: bash tests/validate-templates.sh
      - name: Isolated hook regressions
        run: bash tests/validate-hooks.sh
      - name: Installer and distribution integration
        run: python3 -m unittest discover -s tests -p 'test_cli.py' -v
      - name: Tests leave the checkout unchanged
        run: git diff --exit-code
