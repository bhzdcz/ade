name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate templates
        run: bash tests/validate-templates.sh

      - name: Validate hooks
        run: bash tests/validate-hooks.sh

      # Optional markdownlint — non-blocking soft note in v1 comments.
      # Repo: OWNER/REPO (placeholders until named).
